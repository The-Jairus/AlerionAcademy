# Nginx delante de la aplicación, en un VPS sin Docker.
#
#   sudo cp despliegue/nginx.conf /etc/nginx/sites-available/capacitacion
#   sudo ln -s /etc/nginx/sites-available/capacitacion /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d capacitacion.tuempresa.com     # agrega el HTTPS solo

server {
    listen 80;
    server_name capacitacion.tuempresa.com;   # ← tu dominio

    # Los videos pesan: sin esto la subida del material falla con error 413.
    client_max_body_size 1024M;

    # Convertir un .pptx grande puede tardar más de un minuto.
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # sube el video en streaming, sin llenar el disco
    }

    # El CSS y el JavaScript los sirve Nginx directamente: más rápido.
    location /static/ {
        alias /opt/capacitacion/static/;
        expires 7d;
        access_log off;
    }
}
